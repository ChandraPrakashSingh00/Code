<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#086FFD" />

    <!-- Primary SEO -->
    <title>
      CodeCPS Technologies - Custom Software, Web, Mobile & AI Development Company

    <meta
      name="description"
      content="CodeCPS Technologies is a software development company providing custom software, web development, mobile apps, cloud solutions and AI development services to help businesses grow."

      name="keywords"
      content="CodeCPS Technologies, software development company, web development company, mobile app development, custom software development, AI development, cloud solutions, website development company, software company in India"

    <meta name="robots" content="index, follow" />
    <meta name="author" content="CodeCPS Technologies" />

    <!-- Website URL -->
    <link
      rel="canonical"
      href="https://www.codecpstechnologies.in/"
    />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="CodeCPS Technologies"
    />

    <meta
      property="og:title"
      content="CodeCPS Technologies - Custom Software, Web, Mobile & AI Development"
    />

    <meta
      property="og:description"
      content="Smart software, web, mobile, cloud and AI solutions built to help your business grow faster."
    />

    <meta
      property="og:url"
      content="https://www.codecpstechnologies.in/"
    />

    <meta
      property="og:image"
      content="https://www.codecpstechnologies.in/logotech.jpg"
    />

    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="CodeCPS Technologies - Custom Software, Web, Mobile & AI Development"
    />

    <meta
      name="twitter:description"
      content="Smart software, web, mobile, cloud and AI solutions built to help your business grow faster."
    />

      name="twitter:image"
      content="https://www.codecpstechnologies.in/logotech.jpg"
    />

      name="application-name"
      content="CodeCPS Technologies"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="CodeCPS Technologies"
    />

        "url": "https://www.codecpstechnologies.in/",

      }
